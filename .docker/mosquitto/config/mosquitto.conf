persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type warning
log_timestamp true
connection_messages true

listener 1883

## Authentication ##
allow_anonymous true

#to use custom password for mqtt Server discomment next line
#add password.txt to docker/mosquitto/config
#password_file /mosquitto/config/password.txt
#exec this on mqtt conaitner
#mosquitto_passwd -c /mosquitto/config/password.txt USER